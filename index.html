<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Neurinho</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #unity-container {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Proporção 9:16 baseada na altura da tela */
      #unity-canvas {
        height: 100vh; /* ocupa toda a altura da janela */
        width: calc(100vh * (9 / 16)); /* calcula largura para manter proporção */
        max-width: 100vw; /* não ultrapassa a largura da tela */
        background: black;
        display: block;
      }

      #unity-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      /* Ajuste para mobile: tela inteira (usa largura do dispositivo) */
      @media (max-width: 768px) {
        #unity-canvas {
          width: 100vw;
          height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Neurinho.loader.js";
      var config = {
        dataUrl: buildUrl + "/Neurinho.data",
        frameworkUrl: buildUrl + "/Neurinho.framework.js",
        codeUrl: buildUrl + "/Neurinho.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Thurgh",
        productName: "Neurinho",
        productVersion: "1.0.0"
      };

      // Adiciona meta viewport apenas em mobile
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
